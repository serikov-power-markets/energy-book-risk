[project]
name = "bookrisk"
version = "0.1.0"
description = "Risk of an illustrative TTF trading book: options, forward curve, daily P&L attribution, limits, VaR and ES backtests, swing by least-squares Monte Carlo"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
